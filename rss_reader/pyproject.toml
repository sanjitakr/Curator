[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-reader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "feedparser",
    "tomlkit",
    "textual",
]

[project.scripts]
rss = "rss_reader.main:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
dev-dependencies = []